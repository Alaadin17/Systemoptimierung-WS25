# Konfiguration fuer simulate.py mit der Strategie oemof_solve.
#
# Autor: Alaa Alsleman, GitHub: Alaadin17
#
# Aufruf: python simulate.py --config examples/configs/simulate_with_oemof.cfg
#
# Hinweis: Das Notebook von example_1 (test_run.ipynb, Schritt 3b) baut aus dieser Vorlage
# eine effektive cfg und ueberschreibt dabei
#   - erzwungen : input, save_timeseries/results/soc, visual, oemof_output_dir
#   - per Default: oemof_debug (false), oemof_should_dump_results (true),
#                  oemof_export_graph (true)  [SIM_OVERRIDES]
# und entfernt strategy_option. Die Pfade hier sind also Platzhalter.
# example_2 benutzt seine eigene simulate.cfg dagegen DIREKT, ohne Vorlagen-Logik.
#
# ZWEI FALLEN BEIM SCHREIBEN DIESER DATEI:
# 1) true/false immer KLEIN. Werte werden mit json.loads gelesen, und "True"/"False" sind
#    fuer JSON kein Boolean, sondern ein String - ein nichtleerer String ist in Python wahr,
#    ein "= False" waere also stillschweigend AN. Die oemof_-Schluessel fangen das seit
#    SystemConfig._coerce ab, die normalen spice_ev-Schluessel (visual, cost_calc, ...) NICHT.
# 2) KEIN Kommentar hinter dem Wert. Der cfg-Parser trennt nur am ersten "=" und nimmt den
#    Rest der Zeile als Wert - aus "10.0  # Anlage" wird der String "10.0  # Anlage".
#    Kommentare gehoeren also immer in eine eigene Zeile DARUEBER.

# --- Standard simulate-Optionen ---
input = examples/scenario.json
strategy = oemof_solve
save_timeseries = examples/simulation.csv
save_results    = examples/simulation.json
save_soc        = examples/simulation_soc.csv
cost_calc = true
cost_parameters_file = examples/data/price_sheet.json
visual = true

# ===========================================================================
# oemof-Parameter (flache oemof_<feld>-Schluessel; das Praefix wird abgestreift
# und an SystemConfig.from_options durchgereicht -> spice_ev/oemof_model.py).
# ===========================================================================

# --- Zeit (aus dem Szenario abgeleitet; im Strategie-Pfad ueberschrieben) ---
# oemof_start_date = 2025-01-01
# oemof_periods = 96
# oemof_freq = 15min

# --- Schalter fuer Wege, die das Szenario nicht ausdruecken kann ---
# Was das Szenario sagen kann, wird nicht doppelt geschaltet: PV und Speicher entstehen
# genau dann, wenn sie darin vorkommen. (oemof_enable_pv und oemof_enable_battery gab es
# frueher, sie standen immer auf true und haben die Szenario-Information wiederholt.)
# false = die PV bekommt KEINEN Wechselrichter ins Haus und kann nur einspeisen.
# Achtung: damit entfaellt auch bus_pvac, also alle PV-Direktzweige - ein gesetztes
# oemof_pv_direct_to_storage laeuft dann ins Leere.
oemof_enable_pv_to_home = true
# Hausbus-Export (Batterie/V2G in das Netz). Laut Preisblatt mit 0 ct verguetet - und bei
# zeitvariablen Preisen mit NEGATIVEN Stunden wuerde ein offener Export-Pfad dem LP
# erlauben, gleichzeitig zu kaufen und einzuspeisen (unphysikalische Arbitrage).
# Nur fuer V2G-Studien bewusst aktivieren. PV-Einspeisung laeuft separat ueber excess.
oemof_enable_grid_feedin = false
# Einen Schalter fuer Fahrzeuge gibt es bewusst NICHT: _create_components baut fuer jeden
# Eintrag in vehicle_params einen Bus + BEV-Speicher. Wer ohne Fahrzeug rechnen will, nimmt
# eines im Szenario heraus.

# --- Converter ---
# Wirkungsgrad des Wechselrichters. Seine LEISTUNGSgrenze steht dagegen unten im
# Standalone-Block, weil sie real aus der Anlagengroesse des Szenarios kommt.
oemof_converter_pv_to_home_efficiency = 1.0
oemof_converter_pv_to_home_variable_costs = 0.0
# Fuer den Hausspeicher-Link gibt es KEINE Wirkungsgrad-Felder: der Link ist bewusst
# verlustfrei (conversion_factors 1.0) und begrenzt nur die Leistung. Der Lade-/Entladeverlust
# sitzt komplett im Speicher (oemof_battery_efficiency, Roundtrip eff^2) - genau wie in
# spice_evs Battery. Eine frueher erwogene Variante mit sqrt(eff) je Richtung wurde
# verworfen, weil sie den LP-Speicher effizienter gemacht haette als den simulierten.

# --- Stationaerer Hausspeicher ---
# SOC-Band 0.0..1.0 = spice_ev-Verhalten (die Stationaerbatterie hat dort kein Band;
# sie laedt bis 1 und entlaedt bis 0). Fuer Batterieschonung anheben, z. B. 0.1.
oemof_battery_min_soc = 0.0
oemof_battery_max_soc = 1.0

# --- BEV ---
# Kapazitaet, Start-SOC und discharge_limit kommen pro Fahrzeug aus dem Szenario und stehen
# deshalb unten im Standalone-Block. min_soc und max_soc dagegen gelten IMMER aus dieser
# cfg: build_oemof_inputs schreibt fuer JEDES Fahrzeug config.bev_min_soc / bev_max_soc in
# die vehicle_params, der scheinbare Rueckfallwert im Modell greift also nie.
# SOC-Band 0.0..1.0 = spice_ev-Verhalten (dort gibt es KEIN Batterieschon-Band; Fahrten
# schuetzt desired_soc, V2G schuetzt discharge_limit). Fuer Batterieschonung anheben,
# z. B. 0.2 / 0.95 - das ist dann eine bewusste Modellannahme ohne spice_ev-Pendant.
oemof_bev_min_soc = 0.0
oemof_bev_max_soc = 1.0

# --- Wallbox ---
# ACHTUNG: spice_ev hat KEINEN Wallbox-Verlust - die Ladesaeule begrenzt nur die Leistung,
# der Verlust sitzt in der Fahrzeugbatterie. Werte != 1.0 zaehlen den Verlust doppelt und
# lassen den geplanten SOC vom simulierten wegdriften. Die LEISTUNG der Ladesaeule steht
# unten im Standalone-Block, sie kommt real aus dem Szenario.
oemof_wallbox_efficiency_charge = 1.0
oemof_wallbox_efficiency_discharge = 1.0
oemof_enable_v2h = false

# --- Spaetes Laden bevorzugen (loest die Degeneriertheit bei konstantem Preis) ---
# Ist der Strompreis ueber Stunden gleich, kosten alle Ladezeitpunkte vor der Abfahrt
# exakt dasselbe: das LP hat unendlich viele gleichwertige Loesungen und der Solver waehlt
# willkuerlich eine - im Plot sieht das nach zufaelligen Ladebloecken mitten in der Nacht
# aus. true = frueheres Laden bekommt einen winzigen Aufschlag (fallend von
# oemof_late_charging_penalty auf 0), sodass bei Gleichstand moeglichst SPAET geladen wird,
# also nah an der Abfahrt und damit naeher an der Morgen-PV.
# Der Betrag ist so klein, dass er echte Preisunterschiede nie ueberstimmt.
oemof_prefer_late_charging = true
oemof_late_charging_penalty = 0.001

# --- Gleichzeitiges Laden UND Entladen verbieten ---
# Kostet je Speicher und Zeitschritt eine BINAERVARIABLE: aus dem LP wird ein MILP, die
# Loesezeit steigt um Groessenordnungen (5856 Schritte = 5856 Binaervariablen je Speicher).
#
# Gebraucht wurde das gegen den PV-Ladebonus, der es lohnend machen konnte, PV DURCH einen
# Speicher ins Haus zu leiten. Diesen Bonus gibt es nicht mehr - ohne ihn ist das Kreisen
# schon durch den winzigen storage_cycle_penalty teurer als Nichtstun. Der Schalter bleibt
# fuer eigene Experimente, im Normalbetrieb braucht ihn niemand.
oemof_forbid_simultaneous_storage = false

# --- PREISE (ct/kWh) ---
# Der BEZUGSPREIS hat zwei moegliche Quellen, und das Szenario gewinnt:
#
#   1. Preiskurve aus dem Szenario. Steht in der generate.cfg
#          include_price_csv        = <datei>.csv
#          include_price_csv_option = [["column", "<spalte>"], ["step_duration_s", 3600]]
#      dann macht generate.py aus JEDER CSV-Zeile ein GridOperatorSignal, gueltig ab
#      Szenariostart + Zeilennummer * step_duration_s. Das LP liest genau diese Signale, in
#      genau der Form, die auch spice_evs eigene Strategien sehen, und rechnet damit je
#      Zeitschritt. oemof_grid_variable_costs ist dann WIRKUNGSLOS.
#      EINHEIT: ct/kWh, unveraendert uebernommen. spice_ev fuehrt gc.cost in ct/kWh
#      (scenario.py und costs.py teilen durch 100, generate.py nennt die Spalte per Default
#      "price [ct/kWh]"). Wer EUR/kWh eintraegt, rechnet um Faktor 100 daneben - die
#      Gegenprobe ist die Spalte "price [ct/kWh]" in der erzeugten timeseries.csv.
#   2. Sonst: oemof_grid_variable_costs, konstant ueber den ganzen Horizont.
#
# Was NICHT passiert: kein Preisblatt, kein Tarif-Aufschlag (Netzentgelt, Umlagen,
# Konzessionsabgabe, Stromsteuer, MwSt), kein Leistungspreis. Der Wert - ob aus CSV oder
# aus dieser Zeile - ist der Preis, mit dem gerechnet wird, und sonst nichts. Wer einen
# Endkundenpreis will, schreibt ihn hier hin (35 ct) oder rechnet ihn in die CSV ein; eine
# reine Boersenpreisreihe liegt bei 2 bis 17 ct und damit deutlich zu niedrig.
#
# Eine Ausnahme macht das LP gegenueber spice_ev: NEGATIVE Preise werden auf 0 gekappt.
# Wird man fuers Beziehen bezahlt, findet ein LP sonst eine Geldpumpe - kaufen, im Speicher
# ueber den Wirkungsgrad vernichten, erneut kassieren. Ein reales Haus kann das nicht.
#
# oemof_grid_feedin_tariff ist IMMER fest und gilt fuer BEIDE Exportwege (PV-Ueberschuss
# und Export vom Hausbus). Negativ = Erloes, 0 = keine Verguetung. Nicht positiv machen:
# dann verdient das LP am Einspeisen von gekauftem Strom.
#
# WICHTIG - die Rechnung in results.json entsteht ANDERS. simulate.py laesst nach der
# Simulation spice_evs eigene Kostenrechnung laufen (costs.py), und die rechnet mit dem
# Preisblatt: Netzentgelt, Umlagen, Steuern, Leistungspreis. Die EUR/a dort beantworten
# "was haette das gekostet", der Fahrplan beantwortet "was ist bei diesem Preis sinnvoll".
# Beide Zahlen sind fuer sich richtig, nur eben nicht dieselbe Rechnung.
oemof_pv_variable_costs = 0.0
oemof_grid_variable_costs = 35.0
oemof_grid_feedin_tariff = 0.0

#######################################################

# --- Solver ---
oemof_solver = cbc
oemof_solver_verbose = false
oemof_debug = true
oemof_solver_threads = 8
# ratioGap ist ein MIP-Gap: beim reinen LP wirkungslos. Erst mit
# oemof_forbid_simultaneous_storage = true wird daraus der Abbruchgrund - 0.01 heisst dann,
# dass CBC bei 1 % Abstand zur unteren Schranke aufhoert (bei ~8700 ct also rund 87 ct
# Toleranz). Fuer kurze Horizonte in Ordnung; wer die MILP-Loesung exakt braucht, setzt 0.0
# und nimmt die laengere Rechenzeit in Kauf.
oemof_solver_ratio_gap = 0.01

#######################################################

# --- Ergebnis-Speicherung ---
oemof_should_dump_results = true
oemof_output_dir = results
oemof_dump_filename = dump
oemof_export_graph = false

#######################################################

# --- NUR FUER DEN STANDALONE-BETRIEB ---------------------------------------------------
# Diese Werte greifen im Notebook-/Strategie-Pfad NIE: die Strategie liefert sie immer aus
# dem Szenario mit, und das Modell nimmt den cfg-Wert nur, wenn der Schluessel fehlt
# (_add_* benutzt ueberall .get("...", self.config....)). Sie sind trotzdem noetig, weil
# EnergySystemModel auch ohne spice_ev laufen kann - ueber SystemConfig.from_cfg_file()
# und main() in oemof_model.py. Dort sind sie die einzige Quelle.
# Wer am Modell schraubt, aendert also NICHT diese Zeilen, sondern das Szenario.
# real: gc.max_power des Netzanschlusses
oemof_grid_supply_power_kW = 30.0
# real: Summe der Photovoltaics.nominal_power je GC
oemof_converter_pv_to_home_power_kW = 10.0
# real: charging_stations[csid].max_power
oemof_wallbox_power_kW = 11.0
# real: Batterie im Szenario
oemof_battery_capacity_kWh = 10.2
# real: Ladekurve der Batterie
oemof_battery_max_power_kW = 10.0
# real: Batterie.soc
oemof_battery_initial_soc = 0.2
# real: Batterie.efficiency
oemof_battery_efficiency = 0.95
# real: Fahrzeugbatterie
oemof_bev_capacity_kWh = 77.0
# real: Fahrzeug.soc
oemof_bev_initial_soc = 0.95
# real: vehicle_type.discharge_limit
oemof_bev_discharge_limit = 0.2
# real: Battery.efficiency des Fahrzeugs
oemof_bev_efficiency = 0.95
