# Konfiguration fuer simulate.py mit der Strategie oemof_solve.
#
# Autor: Alaa Alsleman, GitHub: Alaadin17
#
# Aufruf: python simulate.py --config examples/configs/simulate_with_oemof.cfg
#
# Hinweis: Das Notebook von example_1 (test_run.ipynb, Schritt 3b) baut aus dieser Vorlage
# eine effektive cfg und ueberschreibt dabei
#   - erzwungen : input, save_timeseries/results/soc, visual, oemof_output_dir
#   - per Default: oemof_debug (false), oemof_should_dump_results (true),
#                  oemof_export_graph (true)  [SIM_OVERRIDES]
# und entfernt strategy_option. Die Pfade hier sind also Platzhalter.
# example_2 benutzt seine eigene simulate.cfg dagegen DIREKT, ohne Vorlagen-Logik.
#
# ZWEI FALLEN BEIM SCHREIBEN DIESER DATEI:
# 1) true/false immer KLEIN. Werte werden mit json.loads gelesen, und "True"/"False" sind
#    fuer JSON kein Boolean, sondern ein String - ein nichtleerer String ist in Python wahr,
#    ein "= False" waere also stillschweigend AN. Die oemof_-Schluessel fangen das seit
#    SystemConfig._coerce ab, die normalen spice_ev-Schluessel (visual, cost_calc, ...) NICHT.
# 2) KEIN Kommentar hinter dem Wert. Der cfg-Parser trennt nur am ersten "=" und nimmt den
#    Rest der Zeile als Wert - aus "10.0  # Anlage" wird der String "10.0  # Anlage".
#    Kommentare gehoeren also immer in eine eigene Zeile DARUEBER.

# --- Standard simulate-Optionen ---
input = examples/scenario.json
strategy = oemof_solve
save_timeseries = examples/simulation.csv
save_results    = examples/simulation.json
save_soc        = examples/simulation_soc.csv
cost_calc = true
cost_parameters_file = examples/data/price_sheet.json
visual = true

# ===========================================================================
# oemof-Parameter (flache oemof_<feld>-Schluessel; das Praefix wird abgestreift
# und an SystemConfig.from_options durchgereicht -> spice_ev/oemof_model.py).
# ===========================================================================

# --- Zeit (aus dem Szenario abgeleitet; im Strategie-Pfad ueberschrieben) ---
# oemof_start_date = 2025-01-01
# oemof_periods = 96
# oemof_freq = 15min

# --- Feature-Schalter (Komponente erzwungen aus, auch wenn Daten vorhanden) ---
oemof_enable_pv = true
oemof_enable_pv_to_home = true
oemof_enable_battery = true
# Hausbus-Export (Batterie/V2G in das Netz). Laut Preisblatt mit 0 ct verguetet - und bei
# zeitvariablen Preisen mit NEGATIVEN Stunden wuerde ein offener Export-Pfad dem LP
# erlauben, gleichzeitig zu kaufen und einzuspeisen (unphysikalische Arbitrage).
# Nur fuer V2G-Studien bewusst aktivieren. PV-Einspeisung laeuft separat ueber excess.
oemof_enable_grid_feedin = false
# Einen Schalter fuer Fahrzeuge gibt es bewusst NICHT: _create_components baut fuer jeden
# Eintrag in vehicle_params einen Bus + BEV-Speicher. Wer ohne Fahrzeug rechnen will, nimmt
# eines im Szenario heraus.

# --- Converter ---
# Wirkungsgrad des Wechselrichters. Seine LEISTUNGSgrenze steht dagegen unten im
# Standalone-Block, weil sie real aus der Anlagengroesse des Szenarios kommt.
oemof_converter_pv_to_home_efficiency = 1.0
oemof_converter_pv_to_home_variable_costs = 0.0
# Fuer den Hausspeicher-Link gibt es KEINE Wirkungsgrad-Felder: der Link ist bewusst
# verlustfrei (conversion_factors 1.0) und begrenzt nur die Leistung. Der Lade-/Entladeverlust
# sitzt komplett im Speicher (oemof_battery_efficiency, Roundtrip eff^2) - genau wie in
# spice_evs Battery. Eine frueher erwogene Variante mit sqrt(eff) je Richtung wurde
# verworfen, weil sie den LP-Speicher effizienter gemacht haette als den simulierten.

# --- Stationaerer Hausspeicher ---
# SOC-Band 0.0..1.0 = spice_ev-Verhalten (die Stationaerbatterie hat dort kein Band;
# sie laedt bis 1 und entlaedt bis 0). Fuer Batterieschonung anheben, z. B. 0.1.
oemof_battery_min_soc = 0.0
oemof_battery_max_soc = 1.0

# --- BEV ---
# Kapazitaet, Start-SOC und discharge_limit kommen pro Fahrzeug aus dem Szenario und stehen
# deshalb unten im Standalone-Block. min_soc und max_soc dagegen gelten IMMER aus dieser
# cfg: build_oemof_inputs schreibt fuer JEDES Fahrzeug config.bev_min_soc / bev_max_soc in
# die vehicle_params, der scheinbare Rueckfallwert im Modell greift also nie.
# SOC-Band 0.0..1.0 = spice_ev-Verhalten (dort gibt es KEIN Batterieschon-Band; Fahrten
# schuetzt desired_soc, V2G schuetzt discharge_limit). Fuer Batterieschonung anheben,
# z. B. 0.2 / 0.95 - das ist dann eine bewusste Modellannahme ohne spice_ev-Pendant.
oemof_bev_min_soc = 0.0
oemof_bev_max_soc = 1.0

# --- Wallbox ---
# ACHTUNG: spice_ev hat KEINEN Wallbox-Verlust - die Ladesaeule begrenzt nur die Leistung,
# der Verlust sitzt in der Fahrzeugbatterie. Werte != 1.0 zaehlen den Verlust doppelt und
# lassen den geplanten SOC vom simulierten wegdriften. Die LEISTUNG der Ladesaeule steht
# unten im Standalone-Block, sie kommt real aus dem Szenario.
oemof_wallbox_efficiency_charge = 1.0
oemof_wallbox_efficiency_discharge = 1.0
oemof_enable_v2h = false

# --- Spaetes Laden bevorzugen (loest die Degeneriertheit bei konstantem Preis) ---
# Ist der Strompreis ueber Stunden gleich, kosten alle Ladezeitpunkte vor der Abfahrt
# exakt dasselbe: das LP hat unendlich viele gleichwertige Loesungen und der Solver waehlt
# willkuerlich eine - im Plot sieht das nach zufaelligen Ladebloecken mitten in der Nacht
# aus. true = frueheres Laden bekommt einen winzigen Aufschlag (fallend von
# oemof_late_charging_penalty auf 0), sodass bei Gleichstand moeglichst SPAET geladen wird,
# also nah an der Abfahrt und damit naeher an der Morgen-PV.
# Der Betrag ist so klein, dass er echte Preisunterschiede nie ueberstimmt.
oemof_prefer_late_charging = true
oemof_late_charging_penalty = 0.001

# --- PV-Eigenverbrauchsanreiz: eigene PV->Speicher-Zweige ---
# Am Hausbus sind PV-kWh und Netz-kWh nicht mehr unterscheidbar. Ein Bonus dort wuerde also
# auch Netzstrom belohnen. Mit true bekommt die PV hinter dem Wechselrichter einen eigenen
# AC-Bus, von dem je ein BENANNTER Zweig direkt zur Wallbox-Klemme und in die Hausbatterie
# fuehrt - der Bonus haengt nur dort, ist damit nicht mit Netzstrom abgreifbar, und die
# Spalten pv_direct_wallbox_* / pv_direct_battery_* im dump_summary.csv sind eine echte
# Kennzahl "so viel PV ging direkt in den Speicher".
# false = Modell unveraendert (Default).
oemof_pv_direct_to_storage = false
#
# Bonus in ct/kWh, POSITIV angeben - und VIEL KLEINER als man vermutet.
#
# Der Bonus ist ein TIE-BREAKER, kein Steuerungsinstrument. Ohne ihn ist die Zuordnung
# entartet: PV direkt in den Speicher und PV ueber den Hausbus in denselben Speicher kosten
# exakt gleich viel, der Solver waehlt willkuerlich, und pv_direct_* ist bedeutungslos. Ein
# winziger Bonus macht die Zuordnung eindeutig, ohne den Fahrplan zu aendern.
#
# OBERGRENZE:  bonus <= (1 - eff^2) * Einspeiseverguetung
# Denn ab da lohnt es sich fuer das LP, PV DURCH den Speicher ins Haus zu leiten statt
# direkt: das kostet (1 - eff^2) der kWh, die sonst eingespeist worden waere, bringt aber
# den vollen Bonus. Bei eff = 0.95 und 6.24 ct/kWh Verguetung sind das nur 0.61 ct/kWh!
# Das Modell warnt, wenn die Schwelle ueberschritten wird.
#
# In example_1 (April+Mai) nachgemessen:
#   0.50 ct/kWh -> KEIN einziger Schritt mit gleichzeitigem Laden+Entladen, Kosten +0.01 ct
#   1.00 ct/kWh -> 2478 solche Schritte, +403 ct echte Mehrkosten, und die gemeldeten
#                  "PV->Speicher" 1163 kWh gegen nur 589 kWh tatsaechlichen SOC-Zuwachs
#   8.00 ct/kWh -> 3617 kWh Batterieladung bei 51 kWh PV am Tag, +2194 ct
# Oberhalb der Schwelle misst pv_direct_* also nicht mehr "PV gespeichert", sondern "PV hat
# den Speicherbus beruehrt". Wer die Aufteilung Auto<->Hausbatterie wirklich verschieben
# will, aendert besser das Szenario (Anwesenheit, Speichergroesse) statt den Bonus.
#
# NUR POSITIVE Werte wirken: ein Malus macht den Direktpfad einfach ungenutzt, die PV
# fliesst dann ueber den Hausbus zum selben Speicher.
# Der kuenstliche Anteil laesst sich exakt herausrechnen: dump_costs.csv fuehrt neben
# objective auch pv_bonus_ct und objective_ohne_bonus. Die EUR/a aus results.json sehen den
# Bonus ohnehin nie - sie werden nach der Simulation aus der physikalischen Zeitreihe
# gerechnet und sind damit immer echtes Geld.
oemof_pv_charge_bonus_vehicle_ct_kWh = 0.0
oemof_pv_charge_bonus_battery_ct_kWh = 0.0

# --- Gleichzeitiges Laden und Entladen verbieten (macht aus dem LP ein MILP!) ---
# Das Kreisen oben ist die Aussage "entweder laden ODER entladen" - und die ist nicht
# linear. Sie braucht je Speicher und Zeitschritt eine BINAERVARIABLE y:
#     zufluss[t] <= P_laden    * y[t]
#     abfluss[t] <= P_entladen * (1 - y[t])          y[t] in {0,1}
# Angesetzt wird an den beiden Speicherfluessen, weil dort alle Wege zusammenlaufen (AC
# ueber den Link UND der PV-Direktzweig); als Big-M dienen die ohnehin vorhandenen
# Leistungsgrenzen, damit die Formulierung so eng wie moeglich bleibt.
# WIRKUNG: vollstaendig - in jeder Messung unten null Schritte mit gleichzeitigem Laden
# und Entladen, wo das LP hunderte hatte.
# PREIS: aus dem LP wird ein MILP, und das skaliert schlecht (example_1, Bonus 8 ct/kWh):
#     96 Schritte (1 Tag)    LP  6.3s / 44 Kreislaufschritte  ->  MILP  3.4s / 0
#    192 Schritte (2 Tage)   LP  3.2s / 87                    ->  MILP  4.7s / 0
#    384 Schritte (4 Tage)   LP  5.0s / 175                   ->  MILP 57.7s / 0
#    768 Schritte (8 Tage)   LP  9.5s / 401                   ->  MILP 92.9s / 0
#   5856 Schritte (61 Tage)  LP 50.0s / 3658                  ->  MILP nach 25 min ABGEBROCHEN
# Faustregel: bis etwa eine Woche brauchbar, darueber nicht mehr.
# Nur einschalten, wenn ein Bonus oberhalb von (1-eff^2)*Einspeiseverguetung wirklich
# gebraucht wird - darunter tritt das Kreisen gar nicht erst auf, und dann ist die
# Nebenbedingung reiner Ballast.
oemof_forbid_simultaneous_storage = false

# --- Mindestladeleistung von spice_ev abschalten ---
# spice_ev nullt in clamp_power() jede Ladeleistung unterhalb von cs.min_power bzw.
# vehicle_type.min_charging_power (z. B. 0.2 kW). Das LP kennt diese Regel nicht und plant
# solche Kleinleistungen trotzdem (etwa um PV-Ueberschuss zu nutzen) - diese Energie kommt
# dann nie im Akku an und der simulierte SOC driftet unter den geplanten.
# true  = beide Grenzen auf 0 setzen -> jede geplante Leistung wird angewendet
# false = alles bleibt wie es ist (spice_ev-Standardverhalten)
oemof_ignore_min_charging_power = false

# --- Kosten (ct/kWh) ---
oemof_pv_variable_costs = 0.0
# NUR FALLBACKS: Enthaelt das Szenario grid_operator_signals (Preis-Events je GC), nutzt
# das LP diese ZEITVARIABEL (EUR/kWh x100 -> ct/kWh). Die Einspeiseverguetung kommt aus
# dem price_sheet (feed-in_remuneration.PV, kWp-Staffel), sofern cost_parameters_file
# gesetzt ist und der GC PV hat. Die Werte hier greifen nur ohne diese Quellen.
oemof_grid_variable_costs = 35.0
oemof_grid_feedin_tariff = 0.0

# --- FESTE Preise statt der zeitvariablen aus dem Szenario/Preisblatt ---
# false = die grid_operator_signals werden ignoriert, oemof_grid_variable_costs gilt als
#         FESTER Bezugspreis (ct/kWh) ueber den ganzen Horizont.
# Der Tarif-Aufschlag wird danach genauso angewendet wie beim variablen Preis: bei
# oemof_tariff = RLM/SLP zahlt man (Preis + Aufschlag) * 1.19. Wer den Endkundenpreis
# direkt vorgeben will, nimmt oemof_tariff = fixed.
oemof_grid_price_from_scenario = true

# ACHTUNG, haeufige Verwechslung: Solange oemof_feedin_tariff_from_price_sheet = true ist UND
# ein Preisblatt gesetzt ist, ist die Zeile darueber WIRKUNGSLOS - das Preisblatt gewinnt und
# liefert bei 10 kWp -6.24 ct/kWh Verguetung. Wer "Einspeisung ohne Verguetung" rechnen will,
# muss zusaetzlich hier false setzen; dann gilt oemof_grid_feedin_tariff fuer beide Pfade
# (PV-Excess und Hausbus-Export). Der Retail-Aufschlag auf den BEZUGSpreis bleibt unberuehrt.
# Merke: Eigenverbrauch schlaegt Einspeisung ohnehin immer, weil der Bezugspreis nie unter
# 14 ct/kWh faellt - der Schalter aendert also die Kostenhoehe, nicht die Ladeentscheidung.
oemof_feedin_tariff_from_price_sheet = true

# --- TARIF: wie sich der Bezugspreis zusammensetzt ---
#   RLM    Gewerbetarif. Arbeitspreis = Netzentgelt nach voltage_level des Netzanschlusses
#          (Staffel <2500 h/a, bei MV 3.49 ct/kWh) + Umlagen + Konzessionsabgabe +
#          Stromsteuer, darauf die MwSt - exakt wie die spice_ev-Kostenrechnung.
#   SLP    Haushaltstarif. Dasselbe, aber mit dem festen SLP-Netzentgelt (7.48 ct/kWh).
#   fixed  Kein Preisblatt. oemof_grid_variable_costs ist der KOMPLETTE Preis in ct/kWh,
#          ohne jeden Aufschlag - fuer "ich gebe meinen Strompreis selbst vor".
#
# Warum RLM der Default ist: simulate.py rechnet fuer jede Strategie ausser
# greedy/balanced/distributed mit RLM ab (dort Zeile 71), und oemof_solve gehoert dazu.
# Mit dem frueheren SLP kalkulierte das LP 7.48 ct/kWh Netzentgelt, waehrend die Rechnung
# mit 3.49 ct/kWh geschrieben wurde - das LP optimierte einen anderen Tarif als den
# abgerechneten.
#
# Gemeint ist NUR der Arbeitspreis. Der Leistungspreis (bei RLM 41.06 EUR/(kW*a) auf die
# hoechste Viertelstunde) bleibt reine Buchhaltung: spice_ev rechnet ihn nach der Simulation
# aus der fertigen Zeitreihe aus (costs.py, calculate_capacity_costs_rlm) und weist ihn in
# results.json aus. Er steht also in der Rechnung, beeinflusst aber bewusst keine
# Ladeentscheidung - das LP kennt ihn nicht.
#
# Ersetzt die frueheren Schluessel oemof_use_retail_markup und oemof_fee_type.
oemof_tariff = RLM
# Pfad zum Preisblatt. Sieht aus wie eine Dopplung von cost_parameters_file ganz oben, ist
# aber KEINE: simulate.py reicht cost_parameters_file NICHT an die Strategie weiter (siehe
# das options-Dict dort) - es geht nur in spice_evs eigene Kostenrechnung als
# price_sheet_path. Die Strategie erreicht das Blatt ausschliesslich ueber diesen oemof_-Key.
# Beide Zeilen werden also gebraucht, und sie sollten auf dieselbe Datei zeigen.
oemof_cost_parameters_file = examples/data/price_sheet.json

#######################################################

# --- Solver ---
oemof_solver = cbc
oemof_solver_verbose = false
oemof_debug = true
oemof_solver_threads = 8
# ratioGap ist ein MIP-Gap: beim reinen LP wirkungslos. Erst mit
# oemof_forbid_simultaneous_storage = true wird daraus der Abbruchgrund - 0.01 heisst dann,
# dass CBC bei 1 % Abstand zur unteren Schranke aufhoert (bei ~8700 ct also rund 87 ct
# Toleranz). Fuer kurze Horizonte in Ordnung; wer die MILP-Loesung exakt braucht, setzt 0.0
# und nimmt die laengere Rechenzeit in Kauf.
oemof_solver_ratio_gap = 0.01

#######################################################

# --- Ergebnis-Speicherung ---
oemof_should_dump_results = true
oemof_output_dir = results
oemof_dump_filename = dump
oemof_export_graph = false

#######################################################

# --- NUR FUER DEN STANDALONE-BETRIEB ---------------------------------------------------
# Diese Werte greifen im Notebook-/Strategie-Pfad NIE: die Strategie liefert sie immer aus
# dem Szenario mit, und das Modell nimmt den cfg-Wert nur, wenn der Schluessel fehlt
# (_add_* benutzt ueberall .get("...", self.config....)). Sie sind trotzdem noetig, weil
# EnergySystemModel auch ohne spice_ev laufen kann - ueber SystemConfig.from_cfg_file()
# und main() in oemof_model.py. Dort sind sie die einzige Quelle.
# Wer am Modell schraubt, aendert also NICHT diese Zeilen, sondern das Szenario.
# real: gc.max_power des Netzanschlusses
oemof_grid_supply_power_kW = 30.0
# real: Summe der Photovoltaics.nominal_power je GC
oemof_converter_pv_to_home_power_kW = 10.0
# real: charging_stations[csid].max_power
oemof_wallbox_power_kW = 11.0
# real: Batterie im Szenario
oemof_battery_capacity_kWh = 10.2
# real: Ladekurve der Batterie
oemof_battery_max_power_kW = 10.0
# real: Batterie.soc
oemof_battery_initial_soc = 0.2
# real: Batterie.efficiency
oemof_battery_efficiency = 0.95
# real: Fahrzeugbatterie
oemof_bev_capacity_kWh = 77.0
# real: Fahrzeug.soc
oemof_bev_initial_soc = 0.95
# real: vehicle_type.discharge_limit
oemof_bev_discharge_limit = 0.2
# real: Battery.efficiency des Fahrzeugs
oemof_bev_efficiency = 0.95
