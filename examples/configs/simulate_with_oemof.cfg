# Konfiguration fuer simulate.py mit der Strategie oemof_solve.
#
# Autor: Alaa Alsleman, GitHub: Alaadin17
#
# Aufruf: python simulate.py --config examples/configs/simulate_with_oemof.cfg
#
# Hinweis: Das Notebook (systemoptimierung/examples/example_1/test_run.ipynb, Schritt 3b)
# baut aus dieser Vorlage eine effektive cfg und ueberschreibt dabei
#   - erzwungen : input, save_timeseries/results/soc, visual, oemof_output_dir
#   - per Default: oemof_debug (false), oemof_should_dump_results (true),
#                  oemof_export_graph (true)  [SIM_OVERRIDES]
# und entfernt strategy_option. Die Werte hier sind also Platzhalter/Defaults.

# --- Standard simulate-Optionen ---
input = examples/scenario.json
strategy = oemof_solve
save_timeseries = examples/simulation.csv
save_results    = examples/simulation.json
save_soc        = examples/simulation_soc.csv
cost_calc = true
cost_parameters_file = examples/data/price_sheet.json
visual = True

# ===========================================================================
# oemof-Parameter (flache oemof_<feld>-Schluessel; das Praefix wird abgestreift
# und an SystemConfig.from_options durchgereicht -> spice_ev/oemof_model.py).
# ===========================================================================

# --- Zeit (aus dem Szenario abgeleitet; im Strategie-Pfad ueberschrieben) ---
# oemof_start_date = 2025-01-01
# oemof_periods = 96
# oemof_freq = 15min

# --- Feature-Schalter (Komponente erzwungen aus, auch wenn Daten vorhanden) ---
oemof_enable_pv = true
oemof_enable_pv_to_home = true
oemof_enable_battery = true
# Hausbus-Export (Batterie/V2G in das Netz). Laut Preisblatt mit 0 ct verguetet - und bei
# zeitvariablen Preisen mit NEGATIVEN Stunden wuerde ein offener Export-Pfad dem LP
# erlauben, gleichzeitig zu kaufen und einzuspeisen (unphysikalische Arbitrage).
# Nur fuer V2G-Studien bewusst aktivieren. PV-Einspeisung laeuft separat ueber excess.
oemof_enable_grid_feedin = false
# ACHTUNG: oemof_enable_vehicles wird NICHT ausgewertet - _create_components baut fuer
# jeden Eintrag in vehicle_params einen Bus + BEV-Speicher, unabhaengig von diesem Feld.
oemof_enable_vehicles = true

# --- System (Fallback; real kommt die Grenze aus gc.max_power im Szenario) ---
oemof_grid_supply_power_kW = 30.0

# --- Converter ---
# NUR FALLBACK: die Wandlergrenze kommt aus Photovoltaics.nominal_power des Szenarios
# (Summe je GC), sofern dort PV-Anlagen gefuehrt sind.
oemof_converter_pv_to_home_power_kW = 10.0
oemof_converter_pv_to_home_efficiency = 1.0
oemof_converter_pv_to_home_variable_costs = 0.0
# ACHTUNG: die beiden folgenden Werte werden NICHT ausgewertet. Der Hausspeicher-Link
# leitet seine Wirkungsgrade aus oemof_battery_efficiency ab (sqrt je Richtung, siehe
# _add_battery), nicht aus diesen Feldern.
oemof_converter_home_to_battery_efficiency = 0.96
oemof_converter_battery_to_home_efficiency = 0.96

# --- Stationaerer Hausspeicher ---
oemof_battery_capacity_kWh = 10.2
# SOC-Band 0.0..1.0 = spice_ev-Verhalten (die Stationaerbatterie hat dort kein Band;
# sie laedt bis 1 und entlaedt bis 0). Fuer Batterieschonung anheben, z. B. 0.1.
oemof_battery_min_soc = 0.0
oemof_battery_max_soc = 1.0
oemof_battery_initial_soc = 0.2
# Lade-/Entladeverlust des Hausspeichers (= spice_ev Battery.efficiency, Roundtrip eff^2).
# Wird pro Batterie aus dem Szenario gelesen; dieses Feld ist nur der Fallback.
oemof_battery_efficiency = 0.95
oemof_battery_max_power_kW = 10.0

# --- BEV ---
# capacity / initial_soc / discharge_limit kommen pro Fahrzeug aus dem Szenario; die Werte
# hier greifen nur, wenn das Fahrzeug dort nicht gefuehrt ist.
# min_soc und max_soc dagegen gelten IMMER aus dieser cfg (build_oemof_inputs setzt sie
# fuer jedes Fahrzeug auf config.bev_min_soc / config.bev_max_soc).
oemof_bev_capacity_kWh = 77.0
# SOC-Band 0.0..1.0 = spice_ev-Verhalten (dort gibt es KEIN Batterieschon-Band; Fahrten
# schuetzt desired_soc, V2G schuetzt discharge_limit). Fuer Batterieschonung anheben,
# z. B. 0.2 / 0.95 - das ist dann eine bewusste Modellannahme ohne spice_ev-Pendant.
oemof_bev_min_soc = 0.0
oemof_bev_max_soc = 1.0
oemof_bev_initial_soc = 0.95
oemof_bev_discharge_limit = 0.2
# Lade-/Entladeverlust der Fahrzeugbatterie (= spice_ev Battery.efficiency), sitzt im
# BEV-Speicher (inflow/outflow_conversion_factor). Der Wert wird pro Fahrzeug aus spice_ev
# gelesen; dieses Feld ist nur der Fallback fuer den Standalone-Betrieb (im Strategie-Pfad
# greift bei fehlender Batterie ein fest verdrahtetes 0.95).
oemof_bev_efficiency = 0.95

# --- Wallbox ---
# ACHTUNG: spice_ev hat KEINEN Wallbox-Verlust - die Ladesaeule begrenzt nur die Leistung,
# der Verlust sitzt in der Batterie (oemof_bev_efficiency). Werte != 1.0 zaehlen den
# Verlust doppelt und lassen den geplanten SOC vom simulierten wegdriften.
# oemof_wallbox_power_kW ist nur ein Fallback: die Leistung kommt je Ladestation aus
# charging_stations[csid]["max_power"], das die Strategie immer mitliefert.
oemof_wallbox_power_kW = 11.0
oemof_wallbox_efficiency_charge = 1.0
oemof_wallbox_efficiency_discharge = 1.0
oemof_enable_v2h = false

# --- Spaetes Laden bevorzugen (loest die Degeneriertheit bei konstantem Preis) ---
# Ist der Strompreis ueber Stunden gleich, kosten alle Ladezeitpunkte vor der Abfahrt
# exakt dasselbe: das LP hat unendlich viele gleichwertige Loesungen und der Solver waehlt
# willkuerlich eine - im Plot sieht das nach zufaelligen Ladebloecken mitten in der Nacht
# aus. true = frueheres Laden bekommt einen winzigen Aufschlag (fallend von
# oemof_late_charging_penalty auf 0), sodass bei Gleichstand moeglichst SPAET geladen wird,
# also nah an der Abfahrt und damit naeher an der Morgen-PV.
# Der Betrag ist so klein, dass er echte Preisunterschiede nie ueberstimmt.
oemof_prefer_late_charging = true
oemof_late_charging_penalty = 0.001

# --- PV-Eigenverbrauchsanreiz: eigene PV->Speicher-Zweige ---
# Am Hausbus sind PV-kWh und Netz-kWh nicht mehr unterscheidbar. Ein Bonus dort wuerde also
# auch Netzstrom belohnen. Mit true bekommt die PV hinter dem Wechselrichter einen eigenen
# AC-Bus, von dem je ein BENANNTER Zweig direkt zur Wallbox-Klemme und in die Hausbatterie
# fuehrt - der Bonus haengt nur dort, ist damit nicht mit Netzstrom abgreifbar, und die
# Spalten pv_direct_wallbox_* / pv_direct_battery_* im dump_summary.csv sind eine echte
# Kennzahl "so viel PV ging direkt in den Speicher".
# false = Modell unveraendert (Default).
oemof_pv_direct_to_storage = false
#
# Bonus in ct/kWh, POSITIV angeben. Drei sinnvolle Betriebspunkte (Beispielszenario):
#   0.01 / 0.01 -> reine MESSUNG. Ohne Bonus ist die Zuordnung entartet (PV direkt ins Auto
#                  und PV ueber den Hausbus ins Auto kosten gleich viel, der Solver waehlt
#                  willkuerlich); der Mini-Bonus macht sie eindeutig, ohne den Fahrplan
#                  messbar zu aendern. Fuer eine Auswertung der richtige Punkt.
#   6.0  / 0.0  -> anstupsen, exportneutral (<= Einspeiseverguetung 6.24 ct/kWh bei 10 kWp).
#   8.0  / 0.0  -> kippt die Aufteilung Auto<->Hausbatterie. Die haengt an der DIFFERENZ der
#                  beiden Werte und kippt erst ueber ~7.5 ct/kWh, weil eine PV-kWh in der
#                  Hausbatterie teuren Abendstrom verdraengt (~30 ct) und im Auto nur die
#                  billige Nachtladung (~20 ct). Kostet also echtes Geld.
# ACHTUNG oberhalb der Einspeiseverguetung: dort verlaesst der Plan bewusst das
# Kostenoptimum (es wird gewarnt). Das LP faengt dann auch an, Energie durch den Speicher zu
# zirkulieren - gleichzeitig laden und entladen -, nur um den Bonus einzusammeln. Die Menge
# bleibt durch die PV-Erzeugung gedeckelt, verschwendet aber Wirkungsgrad.
# NUR POSITIVE Werte wirken: ein Malus macht den Direktpfad einfach ungenutzt, die PV
# fliesst dann ueber den Hausbus zum selben Speicher.
# Der kuenstliche Anteil laesst sich exakt herausrechnen: dump_costs.csv fuehrt neben
# objective auch pv_bonus_ct und objective_ohne_bonus. Die EUR/a aus results.json sehen den
# Bonus ohnehin nie - sie werden nach der Simulation aus der physikalischen Zeitreihe
# gerechnet und sind damit immer echtes Geld.
oemof_pv_charge_bonus_vehicle_ct_kWh = 0.0
oemof_pv_charge_bonus_battery_ct_kWh = 0.0

# --- Mindestladeleistung von spice_ev abschalten ---
# spice_ev nullt in clamp_power() jede Ladeleistung unterhalb von cs.min_power bzw.
# vehicle_type.min_charging_power (z. B. 0.2 kW). Das LP kennt diese Regel nicht und plant
# solche Kleinleistungen trotzdem (etwa um PV-Ueberschuss zu nutzen) - diese Energie kommt
# dann nie im Akku an und der simulierte SOC driftet unter den geplanten.
# true  = beide Grenzen auf 0 setzen -> jede geplante Leistung wird angewendet
# false = alles bleibt wie es ist (spice_ev-Standardverhalten)
oemof_ignore_min_charging_power = false

# --- Kosten (ct/kWh) ---
oemof_pv_variable_costs = 0.0
# NUR FALLBACKS: Enthaelt das Szenario grid_operator_signals (Preis-Events je GC), nutzt
# das LP diese ZEITVARIABEL (EUR/kWh x100 -> ct/kWh). Die Einspeiseverguetung kommt aus
# dem price_sheet (feed-in_remuneration.PV, kWp-Staffel), sofern cost_parameters_file
# gesetzt ist und der GC PV hat. Die Werte hier greifen nur ohne diese Quellen.
oemof_grid_variable_costs = 35.0
oemof_grid_feedin_tariff = 0.0

# ACHTUNG, haeufige Verwechslung: Solange oemof_feedin_tariff_from_price_sheet = true ist UND
# ein Preisblatt gesetzt ist, ist die Zeile darueber WIRKUNGSLOS - das Preisblatt gewinnt und
# liefert bei 10 kWp -6.24 ct/kWh Verguetung. Wer "Einspeisung ohne Verguetung" rechnen will,
# muss zusaetzlich hier false setzen; dann gilt oemof_grid_feedin_tariff fuer beide Pfade
# (PV-Excess und Hausbus-Export). Der Retail-Aufschlag auf den BEZUGSpreis bleibt unberuehrt.
# Merke: Eigenverbrauch schlaegt Einspeisung ohnehin immer, weil der Bezugspreis nie unter
# 14 ct/kWh faellt - der Schalter aendert also die Kostenhoehe, nicht die Ladeentscheidung.
oemof_feedin_tariff_from_price_sheet = true

# --- Retail-Aufschlag: Endkundenpreis statt reinem Energiepreis ---
# Addiert auf die Signal-Zeitreihe die festen ct/kWh-Bestandteile aus dem price_sheet
# (Netzentgelt je fee_type, Umlagen, Konzessionsabgabe, Stromsteuer) und schlaegt darauf
# die MwSt - exakt wie die spice_ev-Kostenrechnung (Einspeisung bleibt netto).
# fee_type wie in spice_ev (simulate.py/costs.py): SLP = Haushalt (fixes Netzentgelt),
# RLM = Gewerbe (Netzentgelt je voltage_level des Netzanschlusses, Staffel <2500 h/a).
oemof_use_retail_markup = true
oemof_fee_type = SLP
# Pfad zum Preisblatt (dieselbe Datei wie cost_parameters_file oben). Wird als oemof_-Key
# uebergeben, damit die spice_ev-Skripte selbst unveraendert bleiben.
oemof_cost_parameters_file = examples/data/price_sheet.json

#######################################################

# --- Solver ---
oemof_solver = cbc
oemof_solver_verbose = false
oemof_debug = true
oemof_solver_threads = 8
oemof_solver_ratio_gap = 0.01

#######################################################
# --- Drei-Tage-Debug-Modus ---
# true -> statt des ganzen Jahres werden drei EINZELTAGE simuliert, jeder als frischer,
# unabhaengiger Lauf. Ausgefuehrt von run_debug_days.py (Notebook Schritt 6 oder direkt:
#   python systemoptimierung/examples/example_1/run_debug_days.py --config <diese cfg>)
# Das Skript schneidet das Jahres-Szenario auf ein Tagesfenster zu (start_time += d Tage,
# n_intervals = 96) und ruft simulate.py je Fenster einmal auf -> die Simulationsschleife
# laeuft exakt 3 x 96 Schritte. Fahrzeug-Events, Last-/PV-Listen und Preissignale filtert
# spice_ev selbst auf das Fenster, die Zeitreihen kommen also automatisch vom richtigen
# Index; Fahrzeug und Batterie starten beim Szenario-Anfangswert.
# HINWEIS: In der Strategie waere das nicht moeglich - die Schleifenlaenge steht fest,
# bevor sie existiert (scenario.py: for step_i in range(self.n_intervals)).
oemof_debug_three_days = true
oemof_debug_day_starts = [15, 180, 300]
# Start-SOC des Fahrzeugs an einem Debug-Tag (Hausbatterie startet immer leer). Bewusst
# unter desired_soc: sonst startet das Auto schon voll, faehrt einmal und kommt zurueck,
# ohne dass danach eine Abfahrt kaeme -> das LP haette keinen Grund zu laden und der
# Debug-Tag zeigte keinen einzigen Ladevorgang.
oemof_debug_initial_soc = 0.3
# Tage je Debug-Fenster; AUSGEWERTET wird immer der LETZTE. Mit 2 hat der Speicher einen
# Folgetag, fuer den sich Laden lohnt. Bei nur 1 Tag waere gespeicherte Energie um
# Mitternacht wertlos (End-of-Horizon-Effekt) - die Hausbatterie bliebe fast leer und der
# PV-Mittagsueberschuss ginge komplett in die Einspeisung.
oemof_debug_window_days = 2

########################################################


# --- Ergebnis-Speicherung ---
oemof_should_dump_results = true
oemof_output_dir = results
oemof_dump_filename = dump
oemof_export_graph = false
