# Configuration for 02_commercial_fleet: 3 golf + 1 sprinter over 7 days, oemof_solve against the built-in strategies (their runs live in laeufe/<strategy>/sim.cfg).
#
# Copy of examples/configs/simulate_with_oemof.cfg - every key is explained there. Values
# that differ from the template: input, save_timeseries, save_results, save_soc, oemof_debug, oemof_output_dir, oemof_export_graph.

# --- standard simulate options ---
input = systemoptimierung/examples/02_commercial_fleet/scenario.json
strategy = oemof_solve
save_timeseries = systemoptimierung/examples/02_commercial_fleet/results/timeseries.csv
save_results = systemoptimierung/examples/02_commercial_fleet/results/results.json
save_soc = systemoptimierung/examples/02_commercial_fleet/results/soc.csv
cost_calc = true
cost_parameters_file = examples/data/price_sheet.json
visual = true

# ===========================================================================
# oemof parameters (flat oemof_<field> keys; spice_ev/util.py collects them, strips the
# prefix and hands them to SystemConfig.from_options -> spice_ev/oemof_model.py).
# ===========================================================================

# --- time (derived from the scenario; overridden on the strategy path) ---
# oemof_start_date = 2025-01-01
# oemof_periods = 96
# oemof_freq = 15min

# --- switches for paths the scenario cannot express ---
# What the scenario CAN express is not switched twice: PV and storages exist exactly when
# the scenario brings them, one bus + storage per vehicle in vehicle_params.
# false = the PV gets NO inverter into the house and can only feed in.
oemof_enable_pv_to_home = true

# --- converter ---
# Efficiency of the inverter. Its POWER limit sits in the fallback block below, because it
# really comes from the plant size in the scenario; note it limits the DC input.
oemof_converter_pv_to_home_efficiency = 1.0
oemof_converter_pv_to_home_variable_costs = 0.0
# There are NO efficiency fields for the house-battery link: the link is lossless on
# purpose (conversion factors 1.0) and only limits the power. The charging/discharging loss
# sits entirely in the storage (oemof_battery_efficiency, round trip eff^2) - exactly like
# spice_ev's Battery. A loss in the link as well would count twice.

# --- stationary house battery ---
# SOC band 0.0..1.0 = spice_ev behaviour (the stationary battery has no band there; it
# charges to 1 and discharges to 0). Raise for battery protection, e.g. 0.1.
oemof_battery_min_soc = 0.0
oemof_battery_max_soc = 1.0

# --- BEV ---
# Capacity, initial SOC and discharge_limit come per vehicle from the scenario and are
# therefore in the fallback block below. min_soc and max_soc, however, ALWAYS come from
# this cfg: build_oemof_inputs writes config.bev_min_soc / bev_max_soc into the
# vehicle_params of EVERY vehicle.
# SOC band 0.0..1.0 = spice_ev behaviour (there is NO protection band there; trips are
# protected by desired_soc, V2G by discharge_limit). Raise for battery protection, e.g.
# 0.2 / 0.95 - that is then a deliberate model assumption without a spice_ev counterpart.
oemof_bev_min_soc = 0.0
oemof_bev_max_soc = 1.0

# --- wallbox ---
# CAUTION: spice_ev has NO wallbox loss - the charging station only limits the power, the
# loss sits in the vehicle battery. Values != 1.0 count the loss twice and let the planned
# SOC drift away from the simulated one. The POWER of the station is in the fallback
# block below; it really comes from the scenario.
oemof_wallbox_efficiency_charge = 1.0
oemof_wallbox_efficiency_discharge = 1.0
oemof_enable_v2h = false

# --- tie-breaker on every storage flow ---
# A tiny surcharge on charging and discharging of every storage (and on V2H feed-back)
# makes pointless cycling strictly worse than doing nothing. Default 0.001 ct/kWh; rarely
# worth changing.
# oemof_storage_cycle_penalty = 0.001

# --- consumer type ---
# Picks what is added to the scenario's EXCHANGE price to get a retail price:
#   price = (exchange + markup) * (1 + vat)
# household   12.09 ct net + 19 % VAT      commercial   8.10 ct net, VAT reclaimable
# Both are sums of grid fee + levies + concession fee + electricity tax from
# examples/data/price_sheet.json; see CONSUMER_TYPES in spice_ev/oemof_model.py.
# Override with oemof_grid_price_markup_ct_kWh / oemof_grid_price_vat if a study needs
# its own numbers. Applies ONLY to a price series from the scenario - the flat
# oemof_grid_variable_costs below is already a retail price and is never marked up.
oemof_consumer_type = commercial

# --- PRICES (ct/kWh) ---
# The PURCHASE PRICE has two possible sources, and the scenario wins:
#
#   1. Price curve from the scenario. If generate.cfg contains
#          include_price_csv        = <file>.csv
#          include_price_csv_option = [["column", "<column>"], ["step_duration_s", 3600]]
#      generate.py turns EVERY CSV row into a GridOperatorSignal, valid from
#      scenario start + row number * step_duration_s. The LP reads exactly these signals,
#      in exactly the form spice_ev's own strategies see, and uses them per time step.
#      oemof_grid_variable_costs is then WITHOUT EFFECT.
#      UNIT: ct/kWh, taken over unchanged. spice_ev keeps gc.cost in ct/kWh (scenario.py
#      and costs.py divide by 100, generate.py names the column "price [ct/kWh]" by
#      default). Whoever enters EUR/kWh is off by a factor of 100 - the cross-check is the
#      column "price [ct/kWh]" in the generated timeseries.csv.
#   2. Otherwise: oemof_grid_variable_costs, constant over the whole horizon.
#
# What does NOT happen: no price sheet, no tariff markup (grid fee, levies, concession
# fee, electricity tax, VAT), no capacity charge. The value - from the CSV or from this
# line - is the price the LP calculates with, and nothing else. Whoever wants a retail
# price writes it here (35 ct) or folds it into the CSV; a pure exchange price series is
# at 2 to 17 ct and thus far too low.
#
# One deliberate difference to spice_ev: NEGATIVE prices are clipped to 0. Being paid to
# draw power lets an LP find a money pump - buy, destroy in the storage through the
# efficiency, collect again. A real house cannot do that.
#
# oemof_grid_feedin_tariff is ALWAYS fixed and applies to the ONE export path there is,
# the PV surplus. Negative = revenue, 0 = no remuneration. Do not make it positive: the
# LP would then earn money by feeding in purchased power. There is no export from the
# house bus: energy from the battery or from a V2H vehicle can only be used in the
# house, never sold.
#
# NOTE - the numbers in results.json are calculated DIFFERENTLY. After the simulation
# simulate.py runs spice_ev's own cost calculation (costs.py), which uses the price sheet:
# grid fee, levies, taxes, capacity charge. The EUR/a there answer "what would that have
# cost", the schedule answers "what makes sense at this price". Both numbers are right,
# they are just not the same calculation.
oemof_pv_variable_costs = 0.0
oemof_grid_variable_costs = 35.0
oemof_grid_feedin_tariff = 0.0

#######################################################

# --- solver ---
oemof_solver = cbc
oemof_solver_verbose = false
oemof_debug = false
# With more than one thread CBC is not deterministic: two runs of the same model can
# return different per-step schedules at the same objective. Compare runs on totals and
# end states, not on single steps - or set 1 for reproducible schedules.
oemof_solver_threads = 8

#######################################################

# --- result storage ---
oemof_should_dump_results = true
oemof_output_dir = systemoptimierung/examples/02_commercial_fleet/results
oemof_dump_filename = dump
oemof_export_graph = true

#######################################################

# --- fallbacks: used only where the scenario provides no value --------------------------
# The strategy takes these from the scenario wherever it can; the model reads the cfg value
# only when the key is missing from what it was handed. Whoever tunes the model therefore
# changes the SCENARIO, not these lines. When each one actually applies:
# grid connector without max_power in the scenario
oemof_grid_supply_power_kW = 30.0
# PV series present but no photovoltaics entry with nominal_power > 0
oemof_converter_pv_to_home_power_kW = 10.0
# never on the strategy path - every charging station carries its max_power
oemof_wallbox_power_kW = 11.0
# never on the strategy path - a battery without capacity is skipped
oemof_battery_capacity_kWh = 10.2
# battery without a loading curve
oemof_battery_max_power_kW = 10.0
# never on the strategy path - a battery always carries an efficiency (default 0.95)
oemof_battery_efficiency = 0.95
# vehicle that has events but is missing from the scenario's vehicle list
oemof_bev_capacity_kWh = 77.0
oemof_bev_initial_soc = 0.95
# vehicle type without discharge_limit
oemof_bev_discharge_limit = 0.2
