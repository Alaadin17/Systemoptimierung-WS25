# Konfiguration für simulate.py — example_1
# Aufruf: python simulate.py --config systemoptimierung/examples/example_1/simulate.cfg

# Eingabe-Szenario (positional argument)
input = systemoptimierung/examples/example_1/scenario.json

# Ladestrategie
strategy = oemof_solve

# Outputs (Results landen im example_1/results/-Unterordner)
save_timeseries = systemoptimierung/examples/example_1/results/timeseries.csv
save_results    = systemoptimierung/examples/example_1/results/results.json
save_soc        = systemoptimierung/examples/example_1/results/soc.csv

# Kostenrechnung mit ausführen
cost_calc = true
cost_parameters_file = examples/data/price_sheet.json

# Flex-Reports überspringen (schneller)
skip_flex_report = true

# ===========================================================================
# Oemof-Parameter (früher spice_ev/oemof_config.cfg)
# Flache oemof_<feld>-Schlüssel; werden von set_options_from_config gesammelt
# und an die Strategie OemofSolve durchgereicht (SystemConfig.from_options).
# Hinweis: start_date/periods/freq/required_columns ergeben sich aus dem
# Szenario bzw. werden pro Fahrzeug generiert und hier NICHT gesetzt.
# ===========================================================================

# System
# Hinweis: grid_supply_power_kW wird aus dem Szenario abgeleitet
# (grid_connectors[gc].max_power) und ist daher hier NICHT mehr gesetzt.
# Ebenso kommt die Wallbox-Leistung je Fahrzeug aus charging_stations.max_power.

# Converter (Hausbatterie-Wandlerleistung kommt aus dem Szenario)
oemof_converter_pv_to_home_power_kW = 10
oemof_converter_home_to_battery_efficiency = 0.96
oemof_converter_battery_to_home_efficiency = 0.96
oemof_converter_pv_to_home_variable_costs = 0.0

# Stationärer Hausspeicher
oemof_battery_capacity_kWh = 10.24
oemof_battery_min_soc = 0.1
oemof_battery_max_soc = 1.0
oemof_battery_initial_soc = 0.1
oemof_battery_efficiency = 1.0
oemof_battery_max_power_kW = 10.0

# BEV (Default/Fallback; pro Fahrzeug aus den Szenario-Stammdaten überschrieben)
oemof_bev_capacity_kWh = 77.0
oemof_bev_min_soc = 0.2
oemof_bev_max_soc = 0.95
oemof_bev_initial_soc = 0.2

# Wallbox
oemof_wallbox_power_kW = 11.0
oemof_wallbox_efficiency_charge = 0.97
oemof_wallbox_efficiency_discharge = 0.97
oemof_enable_v2h = true

# Kosten
oemof_pv_variable_costs = 0.0
oemof_grid_variable_costs = 35.0
oemof_grid_feedin_tariff = -8.0

# Solver
oemof_solver = cbc
oemof_solver_verbose = false
oemof_debug = false
oemof_solver_threads = 8
oemof_solver_ratio_gap = 0.01

# Ergebnis-Speicherung / Logging (falls nötig)
oemof_should_dump_results = false
oemof_dump_filename = scenario_1_oemof
oemof_log_filename = oemof_scenario_1.log
